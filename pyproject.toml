[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toaster-ocr"
version = "0.3.0"
description = "Fast pure-ONNX CPU document OCR combining LiteParse (OCRia-nano-1 + LayoutNet), PP-DocLayout-S, and QInt8 KV-cached pix2text-mfr-1.5"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "liteparse>=2.21.1",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "numpy>=1.24",
    "huggingface-hub>=0.23",
    "tokenizers>=0.20",
    "pypdfium2>=4.30",
]

[project.scripts]
toaster-ocr = "toaster_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
