[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toaster-ocr"
version = "0.2.0"
description = "Pure-ONNX fast-CPU document OCR combining Indra, SLANet-plus, DeepDoc TSR, PP-DocLayout-S, and KV-cached pix2text-mfr-1.5"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "indra-ocr>=1.1.2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
    "tokenizers>=0.20",
    "pypdfium2>=4.30",
]

[project.scripts]
toaster-ocr = "toaster_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
