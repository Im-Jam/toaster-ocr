[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toaster-ocr"
version = "0.1.0"
description = "CPU-first composable document OCR: Indra + PP-DocLayoutV3 + SLANet + confidence-switched PP-OCRv6"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "indra-ocr>=1.1.2",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
layout = [
    "transformers>=4.49",
    "torch>=2.2",
]
table = [
    "paddlepaddle>=3.0",
]
all = [
    "toaster-ocr[layout,table]",
]

[project.scripts]
toaster-ocr = "toaster_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
